<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Emirates Admin</title>
<style>
:root{
  --ink:#0a1628;--ink2:#13233d;--navy:#071426;--navy2:#0d2442;
  --gold:#d6ad5a;--gold2:#f0d28a;--gold3:#9a7430;
  --blue:#2f6fed;--blue2:#1e4fc4;
  --bg:#f3f5f9;--card:#ffffff;--line:#e4e9f2;--muted:#6b7689;
  --green:#12895a;--amber:#b7791f;--red:#d63a3a;
  --shadow:0 1px 2px rgba(10,22,40,.04),0 8px 24px rgba(10,22,40,.06);
  --shadow2:0 2px 4px rgba(10,22,40,.05),0 18px 40px rgba(10,22,40,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,'Hind Siliguri',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;font-weight:800;letter-spacing:-.4px}
h3{font-size:13px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--ink2);margin-bottom:14px;display:flex;align-items:center;gap:8px}
h3:before{content:"";width:3px;height:14px;border-radius:3px;background:linear-gradient(180deg,var(--gold),var(--gold3))}
.muted{color:var(--muted);font-size:12.5px}
.hidden{display:none!important}

/* প্রিলোডার */
#preloader{position:fixed;inset:0;z-index:999;background:radial-gradient(900px 600px at 50% -10%,#1d3f73 0%,transparent 60%),linear-gradient(160deg,#071426,#0d2442 60%,#0a1d36);display:grid;place-items:center;transition:opacity .45s ease,visibility .45s}
#preloader.done{opacity:0;visibility:hidden}
.pl-wrap{display:flex;flex-direction:column;align-items:center;gap:22px}
.pl-logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#f0d28a,#b8862b);display:grid;place-items:center;font-weight:900;font-size:30px;color:#2a1c03;box-shadow:0 0 0 1px #ffffff33,0 18px 40px #d6ad5a44;animation:plPulse 1.6s ease-in-out infinite}
.pl-name{color:#f3e3b8;font-weight:800;letter-spacing:4px;font-size:13px}
.pl-bar{width:180px;height:3px;border-radius:3px;background:#ffffff1a;overflow:hidden}
.pl-bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--gold2),transparent);animation:plSlide 1.2s ease-in-out infinite}
@keyframes plPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes plSlide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.skel{position:relative;overflow:hidden;background:#eef2f8;border-radius:14px;min-height:64px}
.skel:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffffaa,transparent);transform:translateX(-100%);animation:shimmer 1.3s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}

/* লগইন */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 520px at 12% -12%,#2a5aa8 0%,transparent 60%),radial-gradient(700px 420px at 100% 110%,#8a6320 0%,transparent 55%),linear-gradient(160deg,#071426,#0d2442)}
.login{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:36px 32px;box-shadow:0 40px 90px rgba(0,0,0,.45);position:relative;overflow:hidden}
.login:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--gold3),var(--gold2),var(--gold3))}
.login .logo{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#f0d28a,#b8862b);display:grid;place-items:center;font-weight:900;font-size:26px;color:#2a1c03;margin-bottom:18px;box-shadow:0 12px 26px #d6ad5a55}
.login h1{margin-bottom:4px}
.login p{margin-bottom:24px}
.login label{margin-top:4px}
.login input{width:100%;margin-bottom:14px}
.login .btn{width:100%;padding:14px;margin-top:6px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}

/* লেআউট */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,#071426 0%,#0d2442 100%);color:#fff;padding:24px 16px 18px;display:flex;flex-direction:column;border-right:1px solid #ffffff10}
.brand{display:flex;align-items:center;gap:13px;padding:4px 8px 22px;margin-bottom:10px;border-bottom:1px solid #ffffff14}
.brand .mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#f0d28a,#b8862b);display:grid;place-items:center;font-weight:900;font-size:19px;color:#2a1c03;box-shadow:0 10px 22px #d6ad5a40}
.brand b{font-size:16px;display:block;letter-spacing:.4px}
.brand small{color:#9fb6d6;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase}
.grp{font-size:10px;letter-spacing:1.8px;color:#6f8bb3;font-weight:800;margin:18px 10px 8px;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:5px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;background:#ffffff06;border:1px solid #ffffff12;color:#c9d8ec;text-align:left;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:600;font-size:13.5px;transition:all .18s}
.menu button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.menu button:hover{background:#ffffff12;border-color:#ffffff2a;color:#fff}
.menu button.on{background:linear-gradient(90deg,#d6ad5a33,#d6ad5a10);border-color:#d6ad5a88;color:#fff;box-shadow:inset 3px 0 0 var(--gold2),0 8px 20px #00000033}
.menu button.on svg{color:var(--gold2);opacity:1}
.side .foot{margin-top:auto;padding-top:16px}
.side .foot button{width:100%}

.main{min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 30px;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .muted{margin-top:3px}
.top .crumb{font-size:11.5px;color:var(--gold3);font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.content{padding:28px 30px 80px;max-width:1180px;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mobile-bar{display:none}

/* বাটন */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 1px 0 #ffffff40 inset,0 8px 18px rgba(47,111,237,.25);transition:transform .12s,box-shadow .18s,filter .18s}
.btn:hover{filter:brightness(1.06);box-shadow:0 1px 0 #ffffff40 inset,0 12px 24px rgba(47,111,237,.32)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.gold{background:linear-gradient(135deg,#f5dc98,#c9963a);color:#2a1c03;box-shadow:0 1px 0 #ffffff80 inset,0 8px 18px rgba(201,150,58,.35)}
.btn.ghost{background:#fff;color:var(--ink2);border-color:#d5deeb;box-shadow:0 1px 2px rgba(10,22,40,.05)}
.btn.ghost:hover{border-color:#b8c6dc;background:#fafcff}
.btn.ok{background:linear-gradient(135deg,#1fae70,#0f7a4e);box-shadow:0 1px 0 #ffffff40 inset,0 8px 18px rgba(18,137,90,.25)}
.btn.bad{background:linear-gradient(135deg,#ef5350,#c62828);box-shadow:0 1px 0 #ffffff40 inset,0 8px 18px rgba(214,58,58,.25)}
.btn.sm{padding:7px 13px;font-size:12.5px;border-radius:10px}

/* ইনপুট */
input,select,textarea{background:#fff;border:1px solid #d5deeb;border-radius:12px;padding:10px 13px;width:100%;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,111,237,.14)}
label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:7px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}

/* কার্ড */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow);position:relative}
.card.flat{box-shadow:none}
.hero{background:linear-gradient(125deg,#071426 0%,#0d2442 52%,#1b3f72 100%);color:#fff;border-radius:24px;padding:30px 32px;margin-bottom:20px;position:relative;overflow:hidden;box-shadow:var(--shadow2);border:1px solid #d6ad5a40}
.hero:before{content:"";position:absolute;right:-80px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#d6ad5a4d,transparent 70%)}
.hero:after{content:"";position:absolute;left:-60px;bottom:-110px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#2f6fed40,transparent 70%)}
.hero small{opacity:.8;font-size:11.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold2)}
.hero .big{font-size:40px;font-weight:800;margin:8px 0 20px;letter-spacing:-.8px;position:relative;z-index:1}
.hero .subs{display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.hero .subs div{background:#ffffff10;border:1px solid #ffffff26;border-radius:16px;padding:12px 18px;min-width:160px;backdrop-filter:blur(6px)}
.hero .subs small{color:#c8d6ea;letter-spacing:.6px}
.hero .subs b{display:block;font-size:19px;margin-top:3px}
.grid-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.stat .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:14px;box-shadow:0 8px 18px rgba(10,22,40,.18)}
.stat .ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat span{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.2px}
.stat b{display:block;font-size:24px;margin-top:4px;letter-spacing:-.4px}
.stat small{color:var(--muted);font-size:12px}
.g-gold{background:linear-gradient(135deg,#f0d28a,#b8862b)}
.g-blue{background:linear-gradient(135deg,#4d8cf6,#1e4fc4)}
.g-green{background:linear-gradient(135deg,#2bbf80,#0f7a4e)}
.g-amber{background:linear-gradient(135deg,#f6b53c,#c27a12)}
.g-violet{background:linear-gradient(135deg,#9d7cf6,#5b3cc4)}
.g-navy{background:linear-gradient(135deg,#2d4a78,#0d2442)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.line{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:14px}
.line>div{flex:1;min-width:150px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;align-items:center}
.empty{color:var(--muted);text-align:center;padding:48px 20px;background:#fff;border:1px dashed #c7d3e6;border-radius:20px}
.listRow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.listRow:last-child{border-bottom:0}
.quick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;transition:border-color .18s,box-shadow .18s}
.item:hover{border-color:#c9d6ea;box-shadow:var(--shadow2)}
.thumb{width:68px;height:68px;border-radius:16px;background:linear-gradient(135deg,#f6f1e2,#eef3fb);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.upl{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.chipWrap{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;padding:9px 15px;border-radius:999px;border:1px solid #d5deeb;background:#fff;font-weight:700;cursor:pointer;transition:all .15s;font-size:13px}
.chip:hover{border-color:var(--gold)}
.chip.on{background:linear-gradient(135deg,var(--gold2),#c9963a);color:#2a1c03;border-color:#c9963a;box-shadow:0 6px 14px rgba(201,150,58,.3)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cbox{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);transition:border-color .18s}
.cbox:hover{border-color:#c9d6ea}
.cbox .lbl b{display:block;font-size:13.5px}
.cbox .lbl small{color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:11px}
.swatch{width:50px;height:50px;border-radius:14px;border:0;cursor:pointer;padding:0;background:none;box-shadow:0 0 0 1px #d5deeb,0 8px 16px rgba(10,22,40,.12)}
.swatch::-webkit-color-swatch-wrapper{padding:0}
.swatch::-webkit-color-swatch{border:0;border-radius:14px}
.preview{border-radius:18px;padding:20px;margin-top:16px;border:1px solid var(--line);background:linear-gradient(135deg,#fff,#faf7ef)}
.badge{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:800;background:#eef3fb;color:#4a5a78;border:1px solid #dce5f3;letter-spacing:.2px}
.b-pend{background:#fff5e4;color:var(--amber);border-color:#f6dcae}
.b-ok{background:#e6f7ef;color:var(--green);border-color:#bfe8d3}
.b-bad{background:#fdecec;color:var(--red);border-color:#f6c6c6}
.seg{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:5px;margin-bottom:18px;flex-wrap:wrap;box-shadow:var(--shadow)}
.seg button{border:1px solid transparent;background:transparent;padding:9px 17px;border-radius:11px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s}
.seg button:hover{color:var(--ink2)}
.seg button.on{background:linear-gradient(135deg,var(--navy2),#1b3f72);color:#fff;box-shadow:0 6px 14px rgba(13,36,66,.3)}
.tabs-note{font-size:12.5px;color:var(--muted);margin:-6px 0 16px}
.tx-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:6px}
.tx-row>div label span{color:var(--gold3);margin-left:6px}
.search{position:relative;margin-bottom:18px}
.search input{padding-left:42px;border-radius:14px;box-shadow:var(--shadow)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}

#notice{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:28px;background:linear-gradient(135deg,#071426,#0d2442);color:#fff;border-radius:16px;padding:14px 22px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;font-weight:700;box-shadow:0 24px 50px rgba(7,20,38,.45);max-width:92%;border:1px solid #d6ad5a77}
#notice.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:282px;z-index:40;transform:translateX(-100%);transition:transform .28s}
  .side.open{transform:translateX(0)}
  .mobile-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:linear-gradient(100deg,#071426,#0d2442);color:#fff;position:sticky;top:0;z-index:30;border-bottom:1px solid #d6ad5a55}
  .mobile-bar button{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:11px;padding:8px 13px;cursor:pointer;font-weight:700}
  .top{display:none}
  .content{padding:18px 14px 56px}
  .grid-stats{grid-template-columns:1fr 1fr}
  .grid2,.grid3,.cgrid,.tx-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="preloader"><div class="pl-wrap"><div class="pl-logo">E</div><div class="pl-name">EMIRATES ADMIN</div><div class="pl-bar"><i></i></div></div></div>

<div id="loginBox" class="login-wrap hidden">
  <div class="login">
    <div class="logo">E</div>
    <h1>Emirates Admin</h1>
    <p class="muted">অ্যাডমিন অ্যাকাউন্ট দিয়ে প্রবেশ করুন</p>
    <label>ইমেইল</label><input id="email" type="email" autocomplete="username" />
    <label>পাসওয়ার্ড</label><input id="pass" type="password" autocomplete="current-password" />
    <button class="btn" id="loginBtn">লগইন</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<div id="appBox" class="app hidden">
  <aside class="side" id="side">
    <div class="brand"><div class="mark">E</div><div><b>Emirates</b><small>Admin Console</small></div></div>
    <nav class="menu">
      <div class="grp">ওভারভিউ</div>
      <button data-tab="dash" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>ড্যাশবোর্ড</button>
      <button data-tab="users"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 11a3.5 3.5 0 1 0 0-7"/><path d="M22 21a6 6 0 0 0-4-5.6"/></svg>ইউজার</button>
      <button data-tab="kyc"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>KYC যাচাই</button>
      <div class="grp">ওয়ালেট</div>
      <button data-tab="dep"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="3"/><path d="M2 10h20"/><circle cx="17" cy="14.5" r="1.2"/></svg>ডিপোজিট</button>
      <button data-tab="wd"><svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/><path d="M4 21h16"/></svg>উত্তোলন</button>
      <button data-tab="amt"><svg viewBox="0 0 24 24"><path d="M4 7h10"/><path d="M4 12h16"/><path d="M4 17h7"/><circle cx="17" cy="7" r="2"/><circle cx="12" cy="17" r="2"/></svg>ডিপোজিট অ্যামাউন্ট</button>
      <div class="grp">ইনভেস্টমেন্ট</div>
      <button data-tab="pkg"><svg viewBox="0 0 24 24"><path d="M12 2l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>প্যাকেজ</button>
      <button data-tab="gift"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M5 12v9h14v-9"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>গিফট কোড</button>
      <div class="grp">কন্টেন্ট</div>
      <button data-tab="texts"><svg viewBox="0 0 24 24"><path d="M4 6V4h16v2"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>সাইটের লেখা</button>
      <button data-tab="colors"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.3"/><circle cx="12" cy="7.5" r="1.3"/><circle cx="16" cy="10" r="1.3"/></svg>সাইটের রং</button>

let noticeTimer = null;
function notice(msg) {
  const n = $('notice'); n.textContent = msg; n.classList.add('show');
  clearTimeout(noticeTimer); noticeTimer = setTimeout(() => n.classList.remove('show'), 3200);
}
function friendlyErr(e) {
  const raw = String((e && (e.code || e.message)) || '');
  if (/invalid-credential|wrong-password|user-not-found|invalid-email/i.test(raw)) return 'ইমেইল বা পাসওয়ার্ড ভুল';
  if (/too-many-requests/i.test(raw)) return 'অনেকবার চেষ্টা হয়েছে, কিছুক্ষণ পরে আবার চেষ্টা করুন';
  if (/network/i.test(raw)) return 'ইন্টারনেট সংযোগ নেই';
  if (/unauthorized-domain/i.test(raw)) return 'এই ঠিকানা থেকে লগইন করা যাচ্ছে না';
  if (/permission|denied/i.test(raw)) return 'এই কাজের অনুমতি নেই';
  return 'কাজটি সম্পন্ন করা যায়নি, আবার চেষ্টা করুন';
}

function startListeners() {
  if (started) return; started = true;
  onValue(ref(db, 'users'), s => { users = s.val() || {}; markLoaded('users'); render(); }, onErr);
  onValue(ref(db, 'deposits'), s => { deposits = s.val() || {}; markLoaded('deposits'); render(); }, onErr);
  onValue(ref(db, 'withdrawal_requests'), s => { withdrawals = s.val() || {}; markLoaded('withdrawals'); render(); }, onErr);
  onValue(ref(db, 'packages'), s => { packages = s.val() || {}; markLoaded('packages'); render(); }, onErr);
  onValue(ref(db, 'bonus_codes'), s => { gifts = s.val() || {}; markLoaded('gifts'); render(); }, onErr);
  onValue(ref(db, 'gateways'), s => { gateways = s.val() || {}; markLoaded('gateways'); render(); }, onErr);
  onValue(ref(db, 'support_links'), s => { support = s.val() || {}; markLoaded('support'); render(); }, onErr);
  onValue(ref(db, 'site_settings'), s => {
    const v = s.val() || {};
    editable = v.editable_texts || {};
    textBn = v.text_bn || {};
    textEn = v.text_en || {};
    pageColors = v.page_colors || {};
    notice_ = { title: v.notice_title || '', text: v.notice_text || '', tg: v.telegram_channel_url || '' };
    cfg = {
      rates: Array.isArray(v.referral_commission_rates) ? [0,1,2].map(i => num(v.referral_commission_rates[i])) : [0,0,0],
      regBonus: num(v.registration_bonus),
      depMin: num(v.deposit_min_amount),
      depQuick: Array.isArray(v.deposit_quick_amounts) ? v.deposit_quick_amounts.map(Number).filter(Number.isFinite) : [],
      wdMin: num(v.withdrawal_min_amount ?? v.minimum_withdrawal),
      wdFee: v.withdrawal_fee_percent === undefined ? 10 : num(v.withdrawal_fee_percent),
      wdStart: v.withdrawal_start_time || '10:00',
      wdEnd: v.withdrawal_end_time || '17:00',
      kycReq: v.kyc_required_for_withdrawal !== false

    markLoaded('settings'); render();

}

function recentList(obj, left, right) {
  const items = Object.values(obj || {}).sort((a, b) => num(b.createdAt) - num(a.createdAt)).slice(0, 6);

  return items.map(i => `<div class="listRow"><span>${left(i)}</span>${right(i)}</div>`).join('');
}

/* ---------- রেফারেল ---------- */
function referralCounts(phone) {
  const me = users[phone] || {};
  const all = Object.values(users);
  if (!me.referralCode) return [0,0,0];
  const l1 = all.filter(u => u.invitedByCode === me.referralCode);
  const c1 = l1.map(u => u.referralCode).filter(Boolean);
  const l2 = all.filter(u => c1.includes(u.invitedByCode));
  const c2 = l2.map(u => u.referralCode).filter(Boolean);
  const l3 = all.filter(u => c2.includes(u.invitedByCode));
  return [l1.length, l2.length, l3.length];
}

window.manualDeposit = async () => {
  const phone = $('mPhone').value.trim(), amount = Math.floor(num($('mAmt').value));
  if (!users[phone]) return notice('এই নম্বরের ইউজার পাওয়া যায়নি');
  if (amount <= 0) return notice('সঠিক পরিমাণ লিখুন');
  const key = push(ref(db, 'deposits')).key;
  const rec = { id: key, userPhone: phone, userName: users[phone].name || '', amount, method: 'manual', status: DEP.PENDING, trxId: 'ADMIN', createdAt: Date.now() };
  await update(ref(db), { [`deposits/${key}`]: rec, [`users/${phone}/deposits/${key}`]: rec });
  await approveDepositById(key);
};
window.approveDeposit = id => approveDepositById(id);
async function approveDepositById(id) {
  const d = deposits[id];
  if (!d || d.status !== DEP.PENDING) return;
  const claim = await runTransaction(ref(db, `deposits/${id}/status`), cur => cur === DEP.PENDING ? DEP.OK : undefined);
  if (!claim.committed) return notice('ইতোমধ্যে প্রসেস হয়েছে');
  const amount = num(d.amount);
  const user = users[d.userPhone] || {};
  const bal = {}, updates = {};
  bal[d.userPhone] = num(user.balance) + amount;
  updates[`users/${d.userPhone}/balance`] = bal[d.userPhone];
  updates[`users/${d.userPhone}/deposits/${id}/status`] = DEP.OK;
  let code = user.invitedByCode; const seen = new Set([d.userPhone]);
  for (let lvl = 0; lvl < 3 && code; lvl++) {
    const parentPhone = Object.keys(users).find(p => users[p].referralCode === code);
    if (!parentPhone || seen.has(parentPhone)) break;
    seen.add(parentPhone);
    const p = users[parentPhone];
    const rate = num(cfg.rates[lvl]);
    const comm = Math.round(amount * rate) / 100;
    if (comm > 0) {
      bal[parentPhone] = (bal[parentPhone] ?? num(p.balance)) + comm;
      updates[`users/${parentPhone}/balance`] = bal[parentPhone];
      const k = push(ref(db, `users/${parentPhone}/commissions`)).key;
      updates[`users/${parentPhone}/commissions/${k}`] = { fromPhone: d.userPhone, depositId: id, level: lvl + 1, rate, amount: comm, createdAt: Date.now() };
    }
    code = p.invitedByCode;
  }
  await update(ref(db), updates);
  notice('ডিপোজিট অনুমোদিত হয়েছে');
}
window.rejectDeposit = async id => {
  const d = deposits[id];
  if (!d || d.status !== DEP.PENDING) return;
  const claim = await runTransaction(ref(db, `deposits/${id}/status`), cur => cur === DEP.PENDING ? DEP.BAD : undefined);
  if (!claim.committed) return;
  await update(ref(db), { [`users/${d.userPhone}/deposits/${id}/status`]: DEP.BAD });
  notice('ডিপোজিট রিজেক্ট করা হয়েছে');
};

      <div class="item"><div class="row" style="justify-content:flex-start;gap:16px">
        <div class="thumb">${p.image ? `<img src="${p.image}" alt="">` : '<span class="muted">—</span>'}</div>

      </div>`).join('') : `<div class="empty">এখনও কোনো প্যাকেজ নেই। উপরের ফর্ম দিয়ে প্যাকেজ যোগ করুন।</div>`}`;
}
window.pickImage = input => {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) return notice('শুধু ছবি ফাইল দিন');
  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max = 480, scale = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * scale); c.height = Math.round(im.height * scale);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      pkgImage = c.toDataURL('image/jpeg', 0.84);
      renderPackages();
    };
    im.src = reader.result;
  };
  reader.readAsDataURL(file);
};
window.clearImage = () => { pkgImage = ''; renderPackages(); };
window.savePackage = async () => {
  const name = $('pName').value.trim();
  const cost = Math.floor(num($('pCost').value));
  const daily = Math.floor(num($('pDaily').value));
  const duration = Math.floor(num($('pDur').value));
  const limit = Math.max(1, Math.floor(num($('pLimit').value)));
  const status = $('pStatus').value;
  if (!name) return notice('প্যাকেজের নাম লিখুন');
  if (cost <= 0) return notice('সঠিক দাম লিখুন');
  if (duration <= 0) return notice('মেয়াদ কমপক্ষে ১ দিন হতে হবে');
  const id = editPkgId || 'pk' + Date.now().toString(36);
  const image = pkgImage !== null ? pkgImage : ((packages[id] || {}).image || '');
  const data = { id, name, cost, daily, duration, limit, status };
  if (image) data.image = image;
  await update(ref(db), { [`packages/${id}`]: data });
  editPkgId = null; pkgImage = null;
  notice('প্যাকেজ সেভ হয়েছে');
};
window.editPackage = id => { editPkgId = id; pkgImage = null; renderPackages(); window.scrollTo(0, 0); };
window.cancelEditPkg = () => { editPkgId = null; pkgImage = null; renderPackages(); };
window.deletePackage = async id => {

  await update(ref(db), { [`packages/${id}`]: null });

};

function randomCode() {
  const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ', D = '23456789';
  let c = ''; for (let i = 0; i < 4; i++) c += L[Math.floor(Math.random()*L.length)];
  for (let i = 0; i < 4; i++) c += D[Math.floor(Math.random()*D.length)];
  return c;
}

};

/* ---------- পেমেন্ট নম্বর ---------- */
function renderGateways() {
  const b = gateways.bkash || {}, n = gateways.nagad || {};
  $('content').innerHTML = `
    <div class="grid2">
      <div class="card"><h3>বিকাশ</h3>
        <label>এজেন্ট নম্বর (Send Money)</label><input id="gwBkash" value="${esc(b.number || '')}" placeholder="01XXXXXXXXX">
        <div class="actions"><button class="btn" onclick="saveGateway('bkash')">সেভ করুন</button></div>
      </div>
      <div class="card"><h3>নগদ</h3>
        <label>এজেন্ট নম্বর (Send Money)</label><input id="gwNagad" value="${esc(n.number || '')}" placeholder="01XXXXXXXXX">
        <div class="actions"><button class="btn" onclick="saveGateway('nagad')">সেভ করুন</button></div>
      </div>
    </div>
    <p class="muted">এই নম্বরগুলো ইউজারের ডিপোজিট পেজে দেখাবে। ইউজারকে এখানে অবশ্যই Send Money করতে হবে।</p>`;
}
window.saveGateway = async m => {
  const v = ($(m === 'bkash' ? 'gwBkash' : 'gwNagad').value || '').trim();
  if (!/^01[3-9]\d{8}$/.test(v)) return notice('সঠিক ১১ ডিজিটের নম্বর দিন');
  await update(ref(db), { [`gateways/${m}/number`]: v });
  notice('নম্বর সেভ হয়েছে');
};

/* ---------- সাপোর্ট লিংক ---------- */
function renderSupport() {
  $('content').innerHTML = `
    <div class="card"><h3>লিংক</h3>
      <div class="grid3">
        <div><label>কাস্টমার সার্ভিস</label><input id="sSupport" value="${esc(support.support || '')}" placeholder="https://t.me/..."></div>
        <div><label>টেলিগ্রাম চ্যানেল</label><input id="sChannel" value="${esc(support.channel || '')}" placeholder="https://t.me/..."></div>
        <div><label>টেলিগ্রাম গ্রুপ</label><input id="sGroup" value="${esc(support.group || '')}" placeholder="https://t.me/..."></div>
      </div>
      <div class="actions"><button class="btn" onclick="saveSupport()">সেভ করুন</button></div>
    </div>`;
}
window.saveSupport = async () => {
  const v = { support: $('sSupport').value.trim(), channel: $('sChannel').value.trim(), group: $('sGroup').value.trim() };
  for (const k of Object.keys(v)) if (v[k] && !/^https?:\/\//.test(v[k])) return notice('লিংক https:// দিয়ে শুরু হতে হবে');
  await update(ref(db), { support_links: v });
  notice('লিংক সেভ হয়েছে');
};

/* ---------- সাইট নিয়ম ---------- */
function renderSettings() {
  $('content').innerHTML = `
    <div class="grid2">
      <div class="card"><h3>রেফার কমিশন (ডিপোজিটের %)</h3>
        <div class="grid3">
          <div><label>১ম %</label><input id="r1" type="number" min="0" step="0.01" value="${cfg.rates[0]}"></div>
          <div><label>২য় %</label><input id="r2" type="number" min="0" step="0.01" value="${cfg.rates[1]}"></div>
          <div><label>৩য় %</label><input id="r3" type="number" min="0" step="0.01" value="${cfg.rates[2]}"></div>
        </div>
        <div class="actions"><button class="btn" onclick="saveRates()">সেভ করুন</button></div>
      </div>
      <div class="card"><h3>রেজিস্ট্রেশন বোনাস</h3>
        <label>বোনাস (৳)</label><input id="regBonus" type="number" min="0" step="1" value="${cfg.regBonus}">
        <div class="actions"><button class="btn" onclick="saveBonus()">সেভ করুন</button></div>
      </div>
    </div>
    <div class="card"><h3>উত্তোলন</h3>
      <div class="grid2">
        <div><label>সর্বনিম্ন উত্তোলন (৳)</label><input id="wMin" type="number" min="0" step="1" value="${cfg.wdMin}"></div>
        <div><label>উত্তোলন চার্জ (%)</label><input id="wFee" type="number" min="0" max="100" step="0.01" value="${cfg.wdFee}"></div>
        <div><label>শুরুর সময়</label><input id="wStart" type="time" value="${esc(cfg.wdStart)}"></div>
        <div><label>শেষ সময়</label><input id="wEnd" type="time" value="${esc(cfg.wdEnd)}"></div>
      </div>
      <p class="muted" style="margin:12px 0">উদাহরণ: সর্বনিম্ন ৳200, চার্জ ১০% হলে ব্যালেন্স থেকে ৳200 কাটবে, ইউজার পাবে ৳180।</p>
      <div class="actions"><button class="btn" onclick="saveWithdraw()">সেভ করুন</button></div>
    </div>
    <div class="card"><h3>উত্তোলনে KYC (KYC for Withdrawal)</h3>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
        <input id="kycReq" type="checkbox" ${cfg.kycReq ? 'checked' : ''} style="width:20px;height:20px">
        <span><b>উত্তোলনে KYC বাধ্যতামূলক</b> <span class="muted">(চালু = KYC অনুমোদন ছাড়া উত্তোলন বন্ধ)</span><br>
        <b>KYC required for withdrawal</b> <span class="muted">(ON = withdrawal blocked until KYC is approved)</span></span>
      </label>
      <p class="muted" style="margin:10px 0">বন্ধ (OFF) থাকলে KYC ছাড়াই স্বাভাবিকভাবে উত্তোলন চলবে. / When OFF, withdrawals run normally without KYC.</p>
      <div class="actions"><button class="btn" onclick="saveKycReq()">সেভ করুন / Save</button></div>
    </div>`;
}
window.saveRates = async () => {
  const arr = ['r1','r2','r3'].map(i => Math.max(0, num($(i).value)));
  await update(ref(db, 'site_settings'), { referral_commission_rates: arr });
  notice('সেভ হয়েছে');
};
window.saveBonus = async () => {
  await update(ref(db, 'site_settings'), { registration_bonus: Math.max(0, Math.floor(num($('regBonus').value))) });
  notice('সেভ হয়েছে');
};
window.saveWithdraw = async () => {
  const w = Math.max(0, Math.floor(num($('wMin').value)));
  const fee = Math.min(100, Math.max(0, num($('wFee').value)));
  await update(ref(db, 'site_settings'), {
    withdrawal_min_amount: w,
    minimum_withdrawal: w,
    withdrawal_fee_percent: fee,
    withdrawal_start_time: $('wStart').value || '10:00',
    withdrawal_end_time: $('wEnd').value || '17:00'
  });
  notice('সেভ হয়েছে');
};


/* ---------- KYC যাচাই ---------- */
let kycFilter = 'pending';
function renderKyc() {
  const rows = Object.entries(users)
    .filter(([, u]) => u && u.kyc && u.kyc.nid)
    .filter(([, u]) => (u.kyc.status || 'pending') === kycFilter)
    .sort((x, y) => num(y[1].kyc.submittedAt) - num(x[1].kyc.submittedAt));
  const tabs = [['pending', 'অপেক্ষমাণ · Pending'], ['approved', 'অনুমোদিত · Approved'], ['rejected', 'প্রত্যাখ্যাত · Rejected']]
    .map(([k, l]) => `<button class="btn ${kycFilter === k ? 'ok' : ''} sm" onclick="setKycFilter('${k}')">${l}</button>`).join(' ');
  const img = src => src
    ? `<a href="${src}" target="_blank"><img src="${src}" style="width:100%;max-height:240px;object-fit:contain;border-radius:12px;border:1px solid #e0cd97;background:#fff"></a>`
    : '<span class="muted">ছবি নেই</span>';
  $('content').innerHTML = `<div class="actions" style="margin-bottom:12px">${tabs}</div>` +
    (rows.length ? rows.map(([phone, u]) => {
      const k = u.kyc;
      return `<div class="item" style="flex-direction:column;align-items:stretch">
        <div><b>${esc(k.name || '')}</b> <span class="muted">${esc(phone)}</span> · NID: <b>${esc(k.nid || '')}</b> · <span class="muted">${fmt(k.submittedAt)}</span></div>
        <div class="grid2" style="margin-top:10px">${img(k.front)}${img(k.back)}</div>
        ${kycFilter === 'pending' ? `<div class="actions" style="justify-content:flex-end;margin-top:10px">
          <button class="btn ok sm" onclick="kycSet('${esc(phone)}','approved')">অনুমোদন (Approve)</button>
          <button class="btn bad sm" onclick="kycSet('${esc(phone)}','rejected')">রিজেক্ট (Reject)</button></div>` : ''}
      </div>`;
    }).join('') : '<div class="empty">এই তালিকায় কিছু নেই</div>');
}
window.setKycFilter = k => { kycFilter = k; renderKyc(); };
window.kycSet = async (phone, status) => {
  await update(ref(db, 'users/' + phone + '/kyc'), { status, reviewedAt: Date.now() });
  notice(status === 'approved' ? 'KYC অনুমোদিত হয়েছে' : 'KYC প্রত্যাখ্যাত হয়েছে');
};
window.saveKycReq = async () => {
  await update(ref(db, 'site_settings'), { kyc_required_for_withdrawal: $('kycReq').checked });
  notice('সেভ হয়েছে');
};

/* ---------- এরর সুরক্ষা ---------- */
['creditUser','debitUser','grantPackage','removePackage','toggleBan','saveAccount','manualDeposit','approveDeposit','rejectDeposit','approveWithdraw','rejectWithdraw','saveQuick','resetQuick','saveDepMin','addQuick','savePackage','deletePackage','saveGift','deleteGift','saveTxPair','resetTxPair','saveNotice','saveText','resetText','saveColors','resetColors','saveGateway','saveSupport','saveRates','saveBonus','saveWithdraw'].forEach(n => {
  const f = window[n];
  if (typeof f !== 'function') return;
  window[n] = (...a) => Promise.resolve().then(() => f(...a)).catch(e => notice(friendlyErr(e)));
});
</script>
</body>
</html>
